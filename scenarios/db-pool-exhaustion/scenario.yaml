# Canonical scenario definition -- schema reference for all 6 scenarios.
id: db-pool-exhaustion
title: Checkout connection pool exhaustion
difficulty: intermediate

deployment_marker:
  service: checkout
  version: v1.8.3-buggy
  git_commit: scenario-db-pool-exhaustion
  config: '{"pool_max":20,"db_connection_leak":true}'

inject:
  - target: checkout
    fault_config:
      db_connection_leak: true

# The leak is permanent (a real connection is dropped from the pool, not just a flag).
# Resetting the fault config stops new leaks but can't reclaim ones already lost, so this
# scenario needs an actual container restart to return to a true baseline between runs.
reset_restart: checkout

ground_truth:
  root_cause: connection_pool_exhaustion
  triggering_change: deployment_v1.8.3-buggy
  affected_service: checkout

expected_symptoms:
  - checkout connection pool saturates to its configured max
  - db.pool.idle drops to zero while db.pool.active pins at max
  - database CPU remains normal (the DB itself is healthy; the pool is the bottleneck)

symptom_check:
  query: >-
    SELECT argMax(Value, TimeUnix) FROM otel.otel_metrics_gauge
    WHERE MetricName='db.pool.active' AND TimeUnix > toDateTime64('{injected_at}', 3, 'UTC')
  operator: ">="
  threshold: 18.0
  poll_interval_seconds: 5
  max_wait_seconds: 60

alert:
  name: checkout-pool-exhausted
  condition: "db.pool.active >= 18 (of pool_max 20)"

allowed_remediations:
  - rollback_deployment
  - restart_service:checkout

unsafe_actions:
  - restart_service:postgres
  - scale_service:all

recovery_conditions:
  stability_window_seconds: 60

lifecycle:
  warm_seconds: 10
  session_window_seconds: 20
  time_limit_seconds: 300
